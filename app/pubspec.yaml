name: esystem_church
description: "e-System Church — plateforme de centralisation des églises en Côte d'Ivoire (MVP)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.0
  flutter_secure_storage: ^9.2.0
  # file_picker épinglé en 10.3.10 : la 11.x ne compile plus son Kotlin
  # sous AGP 9, elle compte sur le Kotlin intégré d'AGP, désactivé ici
  # par android.builtInKotlin=false. La 10.3.10 applique elle-même le
  # plugin Kotlin, comme share_plus et mobile_scanner, et son API
  # FilePicker.platform.pickFiles est identique pour notre usage.
  # (La 10.3.11 est retirée sur pub.dev, le solveur la refuse.)
  file_picker: 10.3.10
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  share_plus: ^11.0.0
  mobile_scanner: ^7.3.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Icône ESC simplifiée d'e-System Church (projection couleurs du
  # logo, validée par Axel le 14 novembre 2026 ; correction du même
  # jour : c'est l'icône ESC qui va dans l'application, pas le logo
  # complet).
  assets:
    - assets/icone-esc.png
  # Polices de l'artefact, embarquées dans le build (aucun
  # téléchargement à l'exécution, site statique et APK autonomes).
  # Fichiers TTF officiels Google Fonts, poids utilisés par le thème.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
